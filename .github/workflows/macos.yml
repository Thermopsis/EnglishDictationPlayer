name: Build and verify macOS app
on:
  workflow_dispatch:
  push:
    branches: [main, macos-app]
    paths: ['macOS/**', '.github/workflows/macos.yml']
permissions:
  contents: read
concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true
jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build universal application and verify signature
        run: bash macOS/build.sh
      - name: Run native audio and lesson tests
        env:
          TEST_OUTPUT: ${{ github.workspace }}/macOS/dist/tests
          WINDOWS_LESSON: ${{ github.workspace }}/macOS/fixtures/windows-v1.1.edlesson
        run: |
          set -o pipefail
          macOS/dist/English\ Dictation\ Player.app/Contents/MacOS/DictationPlayer --self-test | tee macOS/dist/SELF_TEST.txt
      - name: Launch real macOS window
        run: |
          APP="$PWD/macOS/dist/English Dictation Player.app"
          "$APP/Contents/MacOS/DictationPlayer" --open "$PWD/macOS/fixtures/windows-v1.1.edlesson" --ui-smoke --ui-output "$PWD/macOS/dist" > macOS/dist/UI_PROCESS.txt 2>&1 &
          PID=$!
          for i in $(seq 1 30); do
            if ! kill -0 "$PID" 2>/dev/null; then break; fi
            sleep 2
          done
          if kill -0 "$PID" 2>/dev/null; then
            /usr/bin/sample "$PID" 2 1 -file macOS/dist/UI_STACK.txt || true
            kill "$PID" || true
            echo 'FAIL UI smoke timeout' > macOS/dist/UI_TEST.txt
          fi
          cat macOS/dist/UI_PROCESS.txt
          cat macOS/dist/UI_TEST.txt
          grep -q 'PASS settings and segmentation sheets' macOS/dist/UI_TEST.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macOS-${{ matrix.os }}
          path: |
            macOS/dist/*.zip
            macOS/dist/*.dmg
            macOS/dist/*.txt
            macOS/dist/*.png
            macOS/dist/tests/*.edlesson
